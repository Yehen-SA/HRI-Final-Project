[project]
name = "breakout"
version = "0.1.0"
description = "Atari Breakout game for the HRI user study."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pygame-ce",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

# Not an installable package: the modules in src/ are run directly (uv run src/main.py).
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers"
markers = [
    "unit: fast, isolated tests of single modules",
    "e2e: tests that run the game as a whole",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
